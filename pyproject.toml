[project]
name = "hftracer"
version = "0.1.0"
description = "Sync coding-agent sessions to a private Hugging Face Storage Bucket."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.9.0",
    "typer>=0.24.0",
]

[project.scripts]
hftracer = "hftracer.cli:app"

[project.urls]
Repository = "https://github.com/twangodev/hftracer"
Issues = "https://github.com/twangodev/hftracer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
